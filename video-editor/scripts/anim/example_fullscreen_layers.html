<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="common2.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 26px; }
  .slab { height: 190px; display: flex; align-items: center; gap: 40px; padding: 0 48px;
          background: var(--surface); border: 3px solid rgba(255, 255, 255, 0.22); }
  .slab .n { font-family: 'Geist Mono', monospace; font-weight: 800; font-size: 88px; color: var(--text-muted); }
  .slab .t { font-weight: 800; font-size: 58px; line-height: 1.08; letter-spacing: -0.01em; }
  #slab3 { background: var(--grad); border: none; }
  #slab3 .n, #slab3 .t { color: #06060a; }
  .chips { display: flex; gap: 18px; margin-top: 44px; flex-wrap: wrap; }
  .chip { font-family: 'Geist Mono', monospace; font-size: 32px; font-weight: 700; letter-spacing: 0.04em;
          padding: 16px 24px; border: 2px solid rgba(0, 198, 162, 0.55); color: var(--teal); opacity: 0; }
</style></head>
<body class="brand-bg">
